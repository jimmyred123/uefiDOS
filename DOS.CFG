# uefiDOS settings -- edit on any PC; lives in the root of the USB stick.
# Kernel-command-line options (dos.<key>=) override these.

# How the disks are presented to the DOS environment:
#   a = legacy i440fx IDE (DEFAULT - verified: DOS lists the drives as ATA)
#   b = q35 built-in AHCI   c = separate AHCI controller
mode=a

# 0 = DOS sees disks READ-ONLY (safe).  1 = writes allowed (prompts to confirm WRITE).
rw=0

# all = every disk except this boot media. Or a list, e.g. disks=nvme0n1 or disks=sda,sdb
disks=all

# guest RAM in MB (512 MB default with Sound Blaster 16 & XMS/UMB support)
mem=512

# auto = use KVM if available, else software emulation. tcg = force software.
accel=auto

# PCI & PCI-to-ISA Bridge Passthrough (VFIO):
#   auto = auto-detect add-in PCI-to-ISA bridges & legacy PCI cards (skips bus 00 host chipset)
#   none = disabled (pure virtual environment)
#   Or a comma-separated list of PCI BDFs, e.g. pci=01:00.0,02:00.0
pci=auto

# Serial and Parallel Port Forwarding:
#   Physical USB-to-Serial adapters (FTDI, Prolific, CH340, CP2102) and USB-to-Parallel cables
#   are automatically forwarded to DOS COM1..COM4 and LPT1..LPT2 in stable physical port order.
