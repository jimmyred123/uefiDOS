# =============================================================================
# uefiDOS Dynamic Slot & Partition Router Configuration
# Lives in the root of the ESP partition (Drive B: inside DOS)
# =============================================================================

[system]
# Active drive router mode:
#   raw_floppy : DEFAULT - 100% RAW physical disk passthrough (Direct Hardware Mode)
#   slots      : Dedicated Appliance Mode with dynamic C:, D:, E: slot routing
router_mode = raw_floppy

[drive_c]
slot = 
mode = temp
description = Primary Storage Slot

[drive_d]
slot = 
mode = rw
description = Secondary Storage Slot

[drive_e]
slot = 
mode = ro
description = Tertiary Storage Slot
