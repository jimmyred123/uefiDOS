# =============================================================================
# uefiDOS Dynamic Drive & Partition Router Configuration
# Lives in the root of the ESP partition (Drive B: inside DOS)
# =============================================================================

[system]
# Active drive router mode:
#   raw_floppy : DEFAULT - 100% RAW physical disk passthrough (Direct Hardware Mode)
#   routed     : Dedicated Drive Routing with dynamic C:, D:, E: targets
router_mode = raw_floppy

# Virtual disk controller mode:
#   a : PIIX IDE Controller (Max 3 hard drives: C:, D:, E: or RAW disks)
#   c : ICH9 AHCI Controller (Max 6 hard drives)
controller_mode = a

# Target targets for C:, D:, E: accept:
#   - Physical partition : /dev/sda1, /dev/nvme0n1p2
#   - Standalone image   : /mnt/esp/VHDs/DISK_C.VHD, /mnt/data/VHDs/SYSTEM_C.VHD
#   - Virtual RAM disk   : ram  (ephemeral 64 MB MBR+FAT16 volume in RAM)
# Modes: rw (Persistent Read/Write), ro (Read-Only), temp (RAM Overlay Snapshot)

[drive_c]
slot = 
mode = temp
description = Primary DOS Drive (C:)

[drive_d]
slot = 
mode = rw
description = Secondary DOS Drive (D:)

[drive_e]
slot = 
mode = ro
description = Tertiary DOS Drive (E:)
