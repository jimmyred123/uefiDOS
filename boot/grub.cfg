# uefiDOS GRUB config  (OPTIONAL fallback path -- primary path is the UKI "freedos.efi" / "dos.efi")
# Embedded into grubx64.efi by scripts/build_grub_efi.sh.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search
insmod search_fs_file
insmod chain
insmod linux
insmod all_video
insmod gzio

set timeout=3
set default=0

# Find the ESP by the marker file (works regardless of hd0/hd1 numbering).
search --no-floppy --file --set=root /EFI/BOOT/freedos.efi
if [ -z "$root" ]; then
    search --no-floppy --file --set=root /EFI/BOOT/dos.efi
fi
if [ -z "$root" ]; then
    search --no-floppy --file --set=root /EFI/BOOT/vmlinuz-freedos.efi
fi
if [ -z "$root" ]; then
    search --no-floppy --file --set=root /EFI/BOOT/vmlinuz-dos.efi
fi
if [ -z "$root" ]; then
    echo "uefiDOS: cannot find the boot partition."
    echo "Drives GRUB can see:"
    ls
    echo "Dropping to the GRUB prompt in 20 s ..."
    sleep 20
fi

# 1) Preferred: the UKI (kernel + initramfs + cmdline in ONE signed-able PE file).
menuentry 'FreeDOS Runtime (read-only default)' {
    if [ -f /EFI/BOOT/freedos.efi ]; then
        chainloader /EFI/BOOT/freedos.efi
    else
        chainloader /EFI/BOOT/dos.efi
    fi
}

# 2) Plain kernel + separate initramfs, console on screen.
menuentry 'FreeDOS Runtime (kernel + initrd)' {
    if [ -f /EFI/BOOT/vmlinuz-freedos.efi ]; then
        linux  /EFI/BOOT/vmlinuz-freedos.efi rdinit=/init panic=0 quiet loglevel=3 nomodeset console=tty0 intel_iommu=on amd_iommu=on iommu=pt
        initrd /EFI/BOOT/initramfs-freedos.img
    else
        linux  /EFI/BOOT/vmlinuz-dos.efi rdinit=/init panic=0 quiet loglevel=3 nomodeset console=tty0 intel_iommu=on amd_iommu=on iommu=pt
        initrd /EFI/BOOT/initramfs-dos.img
    fi
}

# 3) Debug: serial console + kernel messages + drop to a shell before starting QEMU.
menuentry 'FreeDOS Runtime (DEBUG: shell first, serial console)' {
    if [ -f /EFI/BOOT/vmlinuz-freedos.efi ]; then
        linux  /EFI/BOOT/vmlinuz-freedos.efi rdinit=/init panic=0 nomodeset debug ignore_loglevel dos.debug=1 console=ttyS0,115200n8 console=tty0 intel_iommu=on amd_iommu=on iommu=pt
        initrd /EFI/BOOT/initramfs-freedos.img
    else
        linux  /EFI/BOOT/vmlinuz-dos.efi rdinit=/init panic=0 nomodeset debug ignore_loglevel dos.debug=1 console=ttyS0,115200n8 console=tty0 intel_iommu=on amd_iommu=on iommu=pt
        initrd /EFI/BOOT/initramfs-dos.img
    fi
}
